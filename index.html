    // asking the direct parent over the relay protocol above. An

    // degraded state as a refused embed.

        const m = MARKER.exec(el.getAttribute('src') || '');

          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;

      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.

      window.Babel.transformScriptTags();

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

2px;border:1px solid #1d4a3b;background:#0f2a22;border-radius:999px;font-size:13px;color:#6ee7b7;font-weight:600;white-space:nowrap\">\n            <span style=\"width:7px;height:7px;border-radius:50%;background:#34d399\"><\u002Fspan>\n            Booking free surveys now\n          <\u002Fdiv>\n          <h1 style=\"margin:0;font-family:Archivo,sans-serif;font-weight:900;font-size:clamp(36px,5.6vw,64px);line-height:1.02;letter-spacing:-0.025em;color:#f7f9fa;text-wrap:balance\">Expert Resin &amp; Block Paving Driveway Installers in Bangor<\u002Fh1>\n          <p style=\"margin:0;font-size:clamp(16px,1.6vw,19px);line-height:1.6;color:#aab4bf;max-width:560px;text-wrap:pretty\">Properly excavated, properly built. We engineer every driveway from the sub-base up, so it looks sharp on day one and stays level for decades.<\u002Fp>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <div id=\"quote\" style=\"background:#f6f7f8;color:#121a23;border-radius:12px;padding:clamp(22px,3vw,34px);box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);border-top:5px solid #10b981;scroll-margin-top:90px;grid-row:span 2\">\n        <sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n          <form action=\"https://formspree.io/f/xoejaykl\" method=\"POST\" sc-camel-on-submit=\"{{ submit }}\" style=\"display:flex;flex-direction:column;gap:18px\">\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <h2 style=\"margin:0;font-family:Archivo,sans-serif;font-weight:800;font-size:clamp(24px,2.6vw,30px);letter-spacing:-0.015em;line-height:1.1\">Get a Free Transformation Quote<\u002Fh2>\n              <p style=\"margin:0;font-size:15px;color:#4d5966;line-height:1.5\">No-obligation site survey. We reply within one working day.<\u002Fp>\n            <\u002Fdiv>\n            <label style=\"display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:#26313c\">Full Name\n              <input name=\"name\" value=\"{{ form.name }}\" sc- y compacted sub-bases to ensure your new surface remains structurally sound, visually immaculate, and entirely free from weed growth or loose stones for decades to come.<\u002Fp>\n        <p style=\"margin:0;font-size:16px;line-height:1.75;color:#b3bcc6;text-wrap:pretty\">As the leading local driveway contractors serving Bangor, Newtownards, and the greater Holywood area, we handle the entire project lifecycle from the initial site survey and excavation right through to the final precise trowel finish. We understand that a new driveway or patio transformation is a significant investment, which is why our specialized groundwork crews operate with total transparency, absolute structural compliance, and a strict commitment to clean, efficient timelines. Contact our friendly Bangor paving team today through our <a href=\"#quote\">quick quote form<\u002Fa> to arrange your free, no-obligation site measurements and aggregate material consultation.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"border-top:1px solid #1f2833;background:#0a0f15\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:28px 20px 96px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:14px;color:#7d8794\">\n      <div style=\"display:flex;flex-direction:column;gap:6px;max-width:420px\">\n        <a href=\"tel:02891800220\" style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:18px;color:#f4f6f8\" style-hover=\"color:#34d399\">028 9180 0220<\u002Fa>\n        <p style=\"margin:0;font-size:13px;line-height:1.5;font-style:italic;color:#9aa5b1\">Lines are frequently busy due to high onboarding volumes. For an instant response, please use our <a href=\"#quote\">60-Second Digital Quote Form<\u002Fa>.<\u002Fp>\n        <span style=\"margin-top:8px\">© 2026 Bangor Premium Driveways &amp; Paving<\u002Fspan>\n      <\u002Fdiv>\n      <span>Serving Bangor, Holywood, Newtownards, Donaghadee &amp; across North Down<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <sc-if value=\"{{ showStickyBar }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(10,15,21,0.96);border-top:1px solid #1f2833;display:grid;grid-template-columns:1fr 1.4fr;gap:10px;max-width:640px;margin:0 auto\">\n      <a href=\"tel:02891800220\" style=\"height:50px;display:grid;place-items:center;border:1px solid #2f3b49;border-radius:8px;color:#f4f6f8;font-weight:700;font-size:15px\">Call Now<\u002Fa>\n      <a href=\"#quote\" style=\"height:50px;display:grid;place-items:center;background:#f5b53d;border-radius:8px;color:#1d1503;font-family:Archivo,sans-serif;font-weight:800;font-size:15px\">Free Quote<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showTrustStrip&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showStickyBar&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Mobile&quot;}}\">\nclass Component extends DCLogic {\n  state = { form: { name: '', phone: '', postcode: '', service: '' }, submitted: false, error: '' };\n  onField = (e) => { const { name, value } = e.target; this.setState(s => ({ form: { ...s.form, [name]: value }, error: '' })); };\n  submit = (e) => {\n    e.preventDefault();\n    const f = this.state.form;\n    if (!f.name.trim() || !f.phone.trim() || !f.postcode.trim() || !f.service) return this.setState({ error: 'Please fill in all fields so we can prepare your quote.' });\n    if (f.phone.replace(/\\D/g, '').length < 10) return this.setState({ error: 'Please enter a valid UK phone number.' });\n    if (this.state.sending) return;\n    this.setState({ sending: true, error: '' });\n    const fd = new FormData(e.target);\n    fd.set('postcode', f.postcode.toUpperCase());\n    fd.set('_subject', `New ${f.service} quote request – ${f.postcode.toUpperCase()}`);\n    fetch(e.target.action, { method: 'POST', body: fd, headers: { Accept: 'application/json' } })\n      .then(r => r.ok ? this.setState({ submitted: true, sending: false }) : Promise.reject())\n      .catch(() => this.setState({ sending: false, error: 'Sorry, something went wrong sending your request. Please try again or call us.' }));\n  };\n  reset = () => this.setState({ form: { name: '', phone: '', postcode: '', service: '' }, submitted: false });\n  renderVals() {\n    const f = this.state.form;\n    return {\n      form: f, onField: this.onField, submit: this.submit, reset: this.reset,\n      sending: !!this.state.sending, submitLabel: this.state.sending ? 'Sending…' : 'Get My Free Quote →',\n      error: this.state.error, submitted: this.state.submitted, notSubmitted: !this.state.submitted,\n      firstName: f.name.trim().split(' ')[0], postcodeUpper: f.postcode.toUpperCase(),\n      showTrustStrip: this.props.showTrustStrip ?? true,\n      showStickyBar: (this.props.showStickyBar ?? true) && this.state.mobile,\n    };\n  }\n  componentDidMount() { this.onResize = () => this.setState({ mobile: window.innerWidth < 760 }); this.onResize(); window.addEventListener('resize', this.onResize); }\n  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
